[project]
name = "rsna-knee"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fernando Borquez", email = "fernandoborquez215@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "catppuccin>=3.0.0",
    "catppuccin-matplotlib>=0.5",
    "kagglehub>=0.3.13",
    "lingua-language-detector>=2.1.1",
    "matplotlib<3.9",
    "numpy>=2.0.2",
    "pandas>=3.1.1",
    "pydicom>=2.4.4",
    "vllm>=0.5.0.post1",
]

[project.scripts]
rsna-knee = "rsna_knee:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
